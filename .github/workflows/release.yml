name: Release

# Pushing a tag like v0.2.0 builds Planner and attaches it to a GitHub release as
# planner.tgz. Publishing to npm (@limyuquan/planner) is done by hand with `npm publish`.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: mv "$(npm pack --silent)" planner.tgz
      - run: gh release create "$GITHUB_REF_NAME" planner.tgz --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
