name: Landing page

on:
  push:
    branches: [main]
    paths:
      [
        site/**,
        web/**,
        shared/**,
        server/**,
        examples/**,
        skills/**,
        schema/**,
        README.md,
        CONTRIBUTING.md,
        .github/workflows/pages.yml,
      ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The live demo in the hero: the real web app with an in-memory backend.
      - run: npm run build:demo
      # llms-full.txt: the README, every skill and the config schema in one file for agents.
      - run: npm run build:llms
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
